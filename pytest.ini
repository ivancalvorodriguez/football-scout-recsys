[pytest]
testpaths = src/tests
python_files = test_*.py *_test.py
addopts = -ra --strict-markers
markers =
    integracion: prueba la colaboracion entre varios modulos (BD real en tmp_path)
    e2e: lanza los puntos de entrada como subproceso, igual que un usuario
    lento: tarda varios segundos (ajuste de modelos)
