# Configuracion de mutmut (pruebas de mutacion). Ver docs/pruebas.md.
# mutmut solo corre en Linux/WSL; el runner `src/tests/mutacion.py` lo lanza
# dentro de WSL. Este fichero es la unica fuente de config que lee mutmut.
[mutmut]
# Que se muta: todo el codigo de `src`, que es un paquete real del proyecto
# (por eso los modulos se importan como `src.extraccion.*`, `src.similitud.*`).
source_paths=src

# Que NO se muta:
#   - las propias pruebas (mutarlas no tiene sentido),
#   - probar.py: es solo CLI, se prueba por subproceso en e2e y la cobertura
#     dinamica de mutmut no puede atribuir esos tests -> generaria solo ruido.
do_not_mutate=
    src/tests/*
    src/similitud/probar.py

# Ficheros extra que mutmut copia al arbol `mutants/` (ademas de source_paths).
# pytest.ini lleva los marcadores registrados y `--strict-markers`; sin el,
# pytest fallaria al recolectar dentro de `mutants/`.
also_copy=
    pytest.ini

# Que pruebas ejecuta por cada mutante. mutmut usa cobertura para correr solo
# las que tocan la funcion mutada. Se excluyen las e2e (subproceso: la cobertura
# no las atribuye y son lentas); las unit + integracion dan la señal de mutacion.
pytest_add_cli_args_test_selection=
    src/tests
    -m
    not e2e
